<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c0c0c0">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <h1>지뢰찾기</h1>
        <label class="difficulty-control" for="difficulty-select">
          난이도
          <select id="difficulty-select">
            <option value="beginner">초급 · 9 × 9</option>
            <option value="intermediate">중급 · 16 × 16</option>
            <option value="advanced">고급 · 30 × 16</option>
          </select>
        </label>
      </header>

      <section class="game-panel" aria-label="지뢰찾기 게임">
        <div class="status-bar">
          <div class="counter" aria-label="남은 지뢰">
            <span class="sr-only">남은 지뢰</span>
            <strong id="mine-count" aria-live="polite">010</strong>
          </div>
          <button class="restart-button" id="restart-button" type="button" aria-label="새 게임 시작">
            🙂
          </button>
          <div class="counter" aria-label="경과 시간">
            <span class="sr-only">경과 시간</span>
            <strong id="timer">000</strong>
          </div>
        </div>

        <div class="board-wrap">
          <div
            class="board"
            id="board"
            role="group"
            aria-label="9행 9열 지뢰찾기 보드"
            aria-describedby="game-message"
          ></div>
        </div>

        <div class="game-footer">
          <p class="game-message" id="game-message" aria-live="polite">칸을 열어 게임을 시작하세요.</p>
          <p class="instructions">좌클릭: 열기 · 우클릭: 깃발 → ? → 해제</p>
        </div>
      </section>
      <p class="game-note">
        <span>9 × 9 보드 · 지뢰 10개</span>
        <span>최고 기록 <strong id="best-time">--:--</strong></span>
      </p>
    </main>
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  </body>
</html>
